<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block t %}FoodConnect Kitchen Portal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/csv.js') }}"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="nav-brand" href="/">
        <span class="brand-icon">🍳</span> FoodConnect <span class="brand-sub">Kitchen</span>
      </a>
      {% set p = request.path %}
      <div class="nav-links">
        <a href="/" class="nav-item {{ 'active' if p == '/' else '' }}">📋 Orders Dashboard</a>
        <a href="/inventory" class="nav-item {{ 'active' if p == '/inventory' else '' }}">📦 Inventory</a>
        <a href="/donations" class="nav-item {{ 'active' if p == '/donations' else '' }}">🤝 Surplus Donations</a>
        <a href="/group-offers" class="nav-item {{ 'active' if p == '/group-offers' else '' }}">⚡ Group Deals</a>
        <a href="/charity" class="nav-item charity-tag" target="_blank">🌐 Charity Portal ↗</a>
      </div>
    </div>
  </nav>
  <main class="main-content">
    {% block c %}{% endblock %}
  </main>
</body>
</html>
